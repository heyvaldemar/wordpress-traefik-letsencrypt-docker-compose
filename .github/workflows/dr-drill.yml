                  out.append("%s=%s" % (k, v))
          io.open(".env", "w", encoding="utf-8").write("\n".join(out) + "\n")
          print("wrote .env from .env.example with %d overrides" % len(over))
          PY

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts

      - name: The files kept off the dead host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-offsite
          path: dr-out

      - name: Restore on the clean machine, and time it
        run: ./tests/dr-drill.sh after

      - name: Keep the measured result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-result
          path: dr-result.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs --tail 200
